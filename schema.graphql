type Intent @entity {
    id: ID!
    intentAddress: String!
    destinationIntentAddress: String
    sourceChain: Int!
    destinationChain: Int!
    bridgeTokenOutOptions: [TokenAmount!]!
    destinationRecipient: String!
    coordinator: String!
    bridger: String!
    refundAddress: String!
    nonce: BigInt!
    expirationTimestamp: BigInt!
    needsRelay: Boolean
    metadata: String!
    status: IntentStatus!
    totalFunded: BigInt!
    fundingTransactions: [FundingTransaction!]! @derivedFrom(field: "intent")
}

type DestinationIntentIndex @entity {
    id: ID! # destination intent address (lowercased)
    intent: Intent!
}

type PendingDestinationIntent @entity {
    id: ID! # tx hash
    destinationIntentAddress: String!
}

type WatchedIntentAddress @entity {
    id: ID! # address lowercased
    createdAtBlock: BigInt!
    createdAtTimestamp: BigInt!
    tokenAddress: String
}

type PrefillEvent @entity {
    id: ID! # tx_hash-log_index
    intentAddress: String!
    relayer: String!
    tokenAddress: String!
    amount: BigInt!
    chainId: Int!
}

type DestinationFundingTransaction @entity {
    id: ID! # tx_hash-log_index
    intentAddress: String!
    fromAddress: String!
    tokenAddress: String!
    amount: BigInt!
    chainId: Int!
}

type FundingTransaction @entity {
    id: ID! # tx_hash-log_index
    intent: Intent!
    token: Token!
    amount: BigInt!
    chainId: Int!
    tokenAddress: String! # Keep for backward compatibility and easy querying
    isDestination: Boolean!
}

type TokenAmount @entity {
    id: ID!
    token: String!
    amount: BigInt!
    intent: Intent!
}

type Token @entity {
    id: ID! # token address
    address: String!
    symbol: String
    name: String
    decimals: Int
    chainId: Int!
    fundingTransactions: [FundingTransaction!]! @derivedFrom(field: "token")
}

enum IntentStatus {
    PENDING
    FUNDED
    INITIATED
    COMPLETED
}

enum BroadcastStatus {
    PENDING
    EXECUTED
    CANCELLED
}

type Broadcast @entity {
    id: ID!
    broadcastId: Bytes!
    sender: Bytes!
    sourceChain: Int!
    destinationChain: Int!
    destinationRecipient: Bytes!
    refundAddress: Bytes!
    broadcaster: Bytes!
    broadcastingContract: Bytes!
    isLive: Boolean!
    status: BroadcastStatus!
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
    deposits: [BroadcastDeposit!]! @derivedFrom(field: "broadcast")
    bridgeTokenOutOptions: [BroadcastTokenAmount!]! @derivedFrom(field: "broadcast")
}

type BroadcastDeposit @entity {
    id: ID!
    broadcast: Broadcast!
    token: Bytes!
    amount: BigInt!
}

type BroadcastTokenAmount @entity {
    id: ID!
    broadcast: Broadcast!
    token: Bytes!
    amount: BigInt!
}
