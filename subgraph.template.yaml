specVersion: 0.0.4
description: Chainrails subgraph for monitoring intent funding
repository: https://github.com/horuslabsio/chainrails-subgraphs.git
schema:
    file: ./schema.graphql
dataSources:
    - kind: ethereum/contract
      name: IntentFactory
      # prettier-ignore
      network: {{network}}
      source:
          address: "{{intentFactory}}"
          abi: IntentFactory
          # prettier-ignore
          startBlock: {{startBlock}}
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - Intent
          abis:
              - name: IntentFactory
                file: ./abis/intent_factory.json
          eventHandlers:
              - event: IntentDeclared(indexed address,(uint8,uint8,(bytes32,uint256)[],bytes32,address,address,address,uint256,uint256,bool,bytes),indexed address)
                handler: handleIntentDeclared
              - event: IntentCreated(indexed address,(uint8,uint8,(bytes32,uint256)[],bytes32,address,address,address,uint256,uint256,bool,bytes),indexed address)
                handler: handleIntentCreated
          file: ./mappings/intent-factory.ts
    - kind: ethereum/contract
      name: IntentBroadcaster
      # prettier-ignore
      network: {{network}}
      source:
          address: "{{broadcaster}}"
          abi: IntentBroadcaster
          # prettier-ignore
          startBlock: {{startBlock}}
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - Broadcast
              - BroadcastDeposit
              - BroadcastTokenAmount
          abis:
              - name: IntentBroadcaster
                file: ./abis/intent_broadcaster.json
          eventHandlers:
              - event: IntentBroadcasted(indexed bytes32,indexed address,uint8,uint8,bytes32,address,(bytes32,uint256)[],(bytes32,uint256)[],address,indexed address,bool)
                handler: handleIntentBroadcasted
              - event: BroadcastExecuted(indexed bytes32,indexed address)
                handler: handleBroadcastExecuted
              - event: BroadcastCancelled(indexed bytes32,indexed address)
                handler: handleBroadcastCancelled
          file: ./mappings/intent-broadcaster.ts
    - kind: ethereum/contract
      name: Chainrails
      # prettier-ignore
      network: {{network}}
      source:
          address: "{{chainrails}}"
          abi: Chainrails
          # prettier-ignore
          startBlock: {{startBlock}}
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - Intent
              - DestinationIntentIndex
              - FundingTransaction
          abis:
              - name: Chainrails
                file: ./abis/chainrails.json
          eventHandlers:
              - event: IntentStarted(indexed address,(uint8,uint8,(bytes32,uint256)[],bytes32,address,address,address,uint256,uint256,bool,bytes))
                handler: handleIntentStarted
          file: ./mappings/chainrails.ts
    - kind: ethereum/contract
      name: RelayerHub
      # prettier-ignore
      network: {{network}}
      source:
          address: "{{relayerHub}}"
          abi: RelayerHub
          # prettier-ignore
          startBlock: {{startBlock}}
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - WatchedIntentAddress
              - PrefillEvent
          abis:
              - name: RelayerHub
                file: ./abis/relayer_hub.json
          eventHandlers:
              - event: IntentPrefilled(indexed address,indexed address,uint256,address)
                handler: handleIntentPrefilled
          file: ./mappings/relayer-hub.ts
{{#tokens}}
    - kind: ethereum/contract
      name: {{symbol}}
      # prettier-ignore
      network: {{network}}
      source:
          address: "{{address}}"
          abi: ERC20
          # prettier-ignore
          startBlock: {{startBlock}}
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - Intent
              - DestinationIntentIndex
              - WatchedIntentAddress
              - FundingTransaction
              - DestinationFundingTransaction
              - Token
          abis:
              - name: ERC20
                file: ./abis/erc20.json
          eventHandlers:
              - event: Transfer(indexed address,indexed address,uint256)
                handler: handleERC20Transfer
          file: ./mappings/erc20.ts
{{/tokens}}
templates:
    - kind: ethereum/contract
      name: Intent
      network: {{network}}
      source:
          abi: Intent
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.6
          language: wasm/assemblyscript
          entities:
              - FundingTransaction
              - Token
          abis:
              - name: Intent
                file: ./abis/intent.json
          eventHandlers:
              - event: NativeTransfer(indexed address,indexed address,uint256)
                handler: handleNativeTransfer
          file: ./mappings/native-transfer.ts
